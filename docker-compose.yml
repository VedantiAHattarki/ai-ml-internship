version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi-ocr-backend
    container_name: ocr-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ocr-frontend
    container_name: ocr-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped