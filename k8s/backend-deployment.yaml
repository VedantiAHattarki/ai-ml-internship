apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ocr-backend
  template:
    metadata:
      labels:
        app: ocr-backend
    spec:
      containers:
        - name: ocr-backend
          image: 861638088392.dkr.ecr.ap-south-1.amazonaws.com/ocr-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: TESSERACT_CMD
              value: "/usr/bin/tesseract"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20